<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Humanity Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070707;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      width: 92%;
      max-width: 700px;
    }

    .earth {
      font-size: 70px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 42px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #aaaaaa;
      margin-bottom: 35px;
    }

    .counter {
      font-size: 52px;
      font-weight: bold;
      margin: 20px 0 5px;
    }

    .label {
      color: #888;
      margin-bottom: 30px;
    }

    .country-card {
      background: #141414;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 24px;
      margin: 25px 0;
    }

    .flag {
      font-size: 58px;
    }

    .country-name {
      font-size: 26px;
      margin-top: 10px;
      font-weight: bold;
    }

    .country-count {
      color: #aaa;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 14px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: black;
    }

    button:hover {
      transform: scale(1.02);
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 14px;
      background: #111;
    }

    .human-number {
      font-size: 28px;
      font-weight: bold;
    }

    .small {
      color: #888;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="earth">🌍</div>

    <h1>Humanity Live</h1>

    <div class="subtitle">
      One planet. Every country. One growing human connection.
    </div>

    <div class="counter" id="worldCounter">
      12,847
    </div>

    <div class="label">
      humans have joined
    </div>

    <div class="country-card">
      <div class="flag">🇦🇲</div>

      <div class="country-name">
        Armenia
      </div>

      <div class="country-count">
        <span id="armeniaCounter">1,284</span> humans joined
      </div>
    </div>

    <button id="joinButton" onclick="joinHumanity()">
      JOIN ARMENIA 🇦🇲
    </button>

    <div class="result" id="result">

      <div>
        YOU ARE
      </div>

      <div class="human-number" id="humanNumber">
        HUMAN #12,848
      </div>

      <div class="small">
        🇦🇲 You just moved Armenia +1
      </div>

    </div>

  </div>

  <script>
    let worldCount = 12847;
    let armeniaCount = 1284;
    let joined = false;

    function joinHumanity() {

      if (joined) {
        return;
      }

      joined = true;

      worldCount++;
      armeniaCount++;

      document.getElementById("worldCounter").innerText =
        worldCount.toLocaleString();

      document.getElementById("armeniaCounter").innerText =
        armeniaCount.toLocaleString();

      document.getElementById("humanNumber").innerText =
        "HUMAN #" + worldCount.toLocaleString();

      document.getElementById("result").style.display = "block";

      const button = document.getElementById("joinButton");

      button.innerText = "YOU JOINED ✓";
      button.disabled = true;
    }
  </script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    onValue,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJWMHrk6-EwjG_LXLK0CAj3uFLRCuba0Q",
    authDomain: "humanity-live.firebaseapp.com",
    databaseURL: "https://humanity-live-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "humanity-live",
    storageBucket: "humanity-live.firebasestorage.app",
    messagingSenderId: "969876214498",
    appId: "1:969876214498:web:97c4cfa8c81650961c44bb"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const worldRef = ref(db, "counters/world");
  const armeniaRef = ref(db, "countries/AM");

  onValue(worldRef, (snapshot) => {
    const value = snapshot.val() || 0;
    document.getElementById("worldCounter").innerText =
      value.toLocaleString();
  });

  onValue(armeniaRef, (snapshot) => {
    const value = snapshot.val() || 0;
    document.getElementById("armeniaCounter").innerText =
      value.toLocaleString();
  });

  window.joinHumanity = async function () {
    const button = document.getElementById("joinButton");

    if (localStorage.getItem("humanityJoined")) {
      button.innerText = "YOU JOINED ✓";
      button.disabled = true;
      return;
    }

    button.disabled = true;
    button.innerText = "JOINING...";

    try {
      const worldResult = await runTransaction(worldRef, (current) => {
        return (current || 0) + 1;
      });

      await runTransaction(armeniaRef, (current) => {
        return (current || 0) + 1;
      });

      const humanNumber = worldResult.snapshot.val();

      document.getElementById("humanNumber").innerText =
        "HUMAN #" + humanNumber.toLocaleString();

      document.getElementById("result").style.display = "block";

      localStorage.setItem("humanityJoined", "yes");

      button.innerText = "YOU JOINED ✓";
      button.disabled = true;

    } catch (error) {
      console.error(error);

      button.innerText = "TRY AGAIN";
      button.disabled = false;
    }
  };

  if (localStorage.getItem("humanityJoined")) {
    const button = document.getElementById("joinButton");
    button.innerText = "YOU JOINED ✓";
    button.disabled = true;
  }
</script>

</body>
</html>
